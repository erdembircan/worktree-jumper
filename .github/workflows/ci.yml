name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships bash but neither zsh nor fish; the e2e suite
      # evals init output in a real zsh and (when present) a real fish,
      # so both must be installed explicitly.
      - run: sudo apt-get update && sudo apt-get install -y zsh fish

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - run: pnpm test:e2e
